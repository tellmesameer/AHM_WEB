<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="/AHM_WEB/AHM_Website/assets/icons/favicon.svg" type="image/svg+xml">
  <title>Contact - AHM</title>
  <script src="../../../js/site-config.js"></script>
  <div data-include="/AHM_WEB/AHM_Website/components/organisms/head-resources.html"></div>
</head>
<body>
  <div data-include="/AHM_WEB/AHM_Website/components/organisms/header.html"></div>
  <main class="saas-page" id="main">
    <section class="page-hero" aria-labelledby="contact-title">
      <div class="container page-hero__grid">
        <div>
          <p class="eyebrow">Contact us</p>
          <h1 id="contact-title">Let’s plan your data transformation roadmap</h1>
          <p>Tell us about your current architecture and we’ll propose practical next steps tailored to your goals.</p>
        </div>
        <div class="hero-visual" aria-hidden="true"></div>
      </div>
    </section>

    <section class="section-shell">
      <div class="container">
        <div class="contact-form-wrap">
          <form id="contactForm" class="secure-form" action="https://formspree.io/f/mdklygjr" method="POST">
            <input type="hidden" name="_subject" value="New Contact Form Submission - AHM Website">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_template" value="table">

            <div class="row g-4">
              <div class="col-md-6"><label for="firstName" class="form-label">First Name *</label><input type="text" id="firstName" name="firstName" class="form-control" required></div>
              <div class="col-md-6"><label for="lastName" class="form-label">Last Name *</label><input type="text" id="lastName" name="lastName" class="form-control" required></div>
              <div class="col-md-6"><label for="email" class="form-label">Email Address *</label><input type="email" id="email" name="email" class="form-control" required></div>
              <div class="col-md-6"><label for="phone" class="form-label">Phone Number</label><input type="tel" id="phone" name="phone" class="form-control"></div>
              <div class="col-12"><label for="company" class="form-label">Company Name</label><input type="text" id="company" name="company" class="form-control"></div>
              <div class="col-12"><label for="service" class="form-label">Service Interest *</label><select id="service" name="service" class="form-control" required><option value="">Select a service...</option><option value="informatica">Informatica Services</option><option value="snowflake">Snowflake Services</option><option value="idmc">IDMC Solutions</option><option value="python-ai">Python & AI Services</option><option value="web-development">Web Development</option><option value="consultation">General Consultation</option><option value="other">Other</option></select></div>
              <div class="col-12"><label for="message" class="form-label">Message *</label><textarea id="message" name="message" class="form-control" rows="5" required placeholder="Tell us about your data challenges and how we can help..."></textarea></div>
              <div class="col-12"><button type="submit" class="btn btn-primary w-100">Send Message</button></div>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>
  <div data-include="/AHM_WEB/AHM_Website/components/organisms/footer.html"></div>
  <script src="../../../js/partials.js" defer></script>
  <script src="../../../js/phase3.js" defer></script>
</body>
</html>
