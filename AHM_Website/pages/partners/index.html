<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="/AHM_WEB/AHM_Website/assets/icons/favicon.svg" type="image/svg+xml">
  <script src="../../../js/site-config.js"></script>
  <title>Partners — AHM</title>
  <div data-include="/AHM_WEB/AHM_Website/components/organisms/head-resources.html"></div>
</head>
<body>
  <div data-include="/AHM_WEB/AHM_Website/components/organisms/header.html"></div>

  <main class="saas-page" id="main" role="main">
    <section class="page-hero" aria-labelledby="partners-title">
      <div class="container page-hero__grid">
        <div>
          <p class="eyebrow">Trusted ecosystem</p>
          <h1 id="partners-title">Technology partners powering delivery</h1>
          <p>We collaborate with leading cloud and data providers to deliver secure and enterprise-ready outcomes.</p>
        </div>
        <div class="hero-visual" aria-hidden="true"></div>
      </div>
    </section>

    <section class="section-shell" aria-labelledby="partners-strip">
      <div class="container">
        <div class="section-header text-center">
          <h2 id="partners-strip" class="section-title">Partner network</h2>
        </div>
        <div class="logo-strip" aria-label="Partner logos">
          <img src="/AHM_WEB/images/informatica2000-689.png" alt="Informatica logo" width="320" height="92" loading="eager" decoding="async" fetchpriority="high">
          <img src="/AHM_WEB/images/Snowflake_Logo.svg" alt="Snowflake logo" width="320" height="92" loading="eager" decoding="async">
          <img src="/AHM_WEB/images/MSFT_logo_png_grey.png" alt="Microsoft logo" width="320" height="92" loading="eager" decoding="async">
          <img src="/AHM_WEB/images/Amazon_Web_Services_2025.svg" alt="Amazon Web Services logo" width="320" height="92" loading="lazy" decoding="async">
          <img src="/AHM_WEB/images/Google_Cloud_logo.svg" alt="Google Cloud logo" width="320" height="92" loading="lazy" decoding="async">
          <img src="/AHM_WEB/images/Oracle_Corporation_logo.svg" alt="Oracle logo" width="320" height="92" loading="lazy" decoding="async">
        </div>
      </div>
    </section>
  </main>

  <div data-include="/AHM_WEB/AHM_Website/components/organisms/footer.html"></div>

  <script src="../../../js/partials.js" defer></script>
  <script src="../../../js/phase3.js" defer></script>
</body>
</html>
