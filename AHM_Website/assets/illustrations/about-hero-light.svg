<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-labelledby="title desc">
  <title id="title">AHM cloud integration visual light</title>
  <desc id="desc">Cloud platform with connected data nodes in light theme.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dceaff"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d7e7ff"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity=".15"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity=".72"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity=".15"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="980" height="620" rx="34" fill="url(#bg)"/>
  <g stroke="#1d4ed8" stroke-opacity=".08">
    <path d="M0 120H980M0 240H980M0 360H980M0 480H980"/>
    <path d="M140 0V620M280 0V620M420 0V620M560 0V620M700 0V620M840 0V620"/>
  </g>

  <path d="M230 328h176" stroke="url(#wire)" stroke-width="4"/>
  <path d="M574 328h182" stroke="url(#wire)" stroke-width="4"/>
  <path d="M438 378L338 455" stroke="url(#wire)" stroke-width="4"/>
  <path d="M542 378L646 458" stroke="url(#wire)" stroke-width="4"/>

  <g transform="translate(350 216)">
    <rect width="280" height="178" rx="26" fill="url(#tile)" stroke="#93c5fd"/>
    <rect x="52" y="34" width="176" height="110" rx="18" fill="#f8fbff" stroke="#60a5fa" stroke-opacity=".6"/>
    <rect x="88" y="56" width="104" height="66" rx="12" fill="#bfdbfe" fill-opacity=".72"/>
  </g>

  <g transform="translate(130 262)">
    <rect width="110" height="138" rx="18" fill="url(#tile)" stroke="#93c5fd"/>
    <rect x="22" y="26" width="66" height="86" rx="10" fill="#f2f7ff" stroke="#60a5fa" stroke-opacity=".55"/>
    <path d="M32 48h46M32 66h46M32 84h46" stroke="#60a5fa" stroke-opacity=".56"/>
  </g>

  <g transform="translate(740 262)">
    <rect width="110" height="138" rx="18" fill="url(#tile)" stroke="#93c5fd"/>
    <rect x="22" y="26" width="66" height="86" rx="10" fill="#f2f7ff" stroke="#60a5fa" stroke-opacity=".55"/>
    <path d="M32 48h46M32 66h46M32 84h46" stroke="#60a5fa" stroke-opacity=".56"/>
  </g>

  <g transform="translate(308 434)">
    <rect width="100" height="74" rx="16" fill="url(#tile)" stroke="#93c5fd"/>
    <rect x="26" y="20" width="48" height="34" rx="8" fill="#60a5fa" fill-opacity=".72"/>
  </g>

  <g transform="translate(412 118)" filter="url(#glow)">
    <g fill="url(#cloud)">
      <ellipse cx="120" cy="66" rx="118" ry="56"/>
      <circle cx="74" cy="44" r="44"/>
      <circle cx="152" cy="36" r="38"/>
    </g>
    <text x="120" y="78" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="54" font-weight="700" fill="#2563eb">AHM</text>
  </g>
</svg>
